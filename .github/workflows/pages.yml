name: Publicar ConneMeet no GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Implantar versão demonstrativa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Preparar somente arquivos públicos
        run: |
          mkdir -p _site/assets
          cp index.html styles.css app.js _site/
          cp assets/favicon.svg _site/assets/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
